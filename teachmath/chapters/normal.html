            <span class="eyebrow">考試入口</span>
            <h1>常態題只做一件事：把 X 轉成 Z。</h1>
            <p>轉成 Z 後，再判斷題目問小於、大於，還是介於兩數之間。</p>
          </section>

          <section class="lesson-section">
            <div class="section-heading">
              <span class="section-label">手把手解題</span>
              <h2>大於某個分數</h2>
            </div>
            <div data-lesson-root></div>
          </section>

          <section class="support-grid">
            <details open>
              <summary>完整教材重點</summary>
              <ul class="compact-list">
                <li>標準化：$Z=\frac{X-\mu}{\sigma}$。</li>
                <li>小於：直接查 $P(Z&lt;z)$。</li>
                <li>大於：用 $1-P(Z&lt;z)$。</li>
                <li>介於：用 $P(Z&lt;z_b)-P(Z&lt;z_a)$。</li>
                <li>樣本平均題要改用標準誤 $SE=\frac{\sigma}{\sqrt n}$。</li>
              </ul>
            </details>
            <details>
              <summary>章節練習</summary>
              <div class="quiz-list" data-practice></div>
            </details>
            <details>
              <summary>考題題解</summary>
